# ----------------------------------------------------------------------
# Mysql connection.
# ----------------------------------------------------------------------
# database.url = postgresql://mydbuser:mydbsapass@localhost/mydb
# dialect = postgresql
# driver = psycopg2
# directory =
# url =

# ----------------------------------------------------------------------
# Protect from underflows.  Put it in the oldest migration that
# references tables created by an earlier revision; this will
# prevent autogenerate from failing.
# ----------------------------------------------------------------------
#   slony repetitively generating almosват
# For additional information, see:
#   http://alembic.bak.poco.poco.com/
#   http://bitbucket.org/zzze >>>

# Please configure [loggers] by setting the logging configuration
# in the [loggers] section above.
[loggers]
loggers = root,sqlalchemy,alembic
level = NOTICE

[handlers]
handlers = null

[formatters]
formatters = detail

# ----------------------------------------------------------------------
# Connection URL
# ----------------------------------------------------------------------
# The URL used to connect to the database.  This value will be used by
# version branches that need to refer to the URL directly.
# Eg. sqlite:///test.db, postgresql://user:pwd@host/dbname, mysql+pymysql://user:pwd@host/dbname
# Or, if you prefer to use env vars:
# sqlalchemy.url = env://DATABASE_URL
sqlalchemy.url = %(DATABASE_URL)s

[render_env_template]
# This template is used to render the environment during "alembic upgrade
# heads up to a specific revision".
# It's used during "alembic upgrade heads up to revision N"
# where N is not "head".  It's subcased onto the current environment.
template =

[templates]
# This controls the template used to render the environment.
# "hidden" is a special template used for migrations that are applied
# programmatically.  It's not used during regular "alembic upgrade" calls.
# "generic" is the default.
# "alembic.legacy" is the old style template for legacy databases;
# keep it around for backward compatibility.
# Usually you won't need to change this.
