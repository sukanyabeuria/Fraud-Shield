[incremental]
# When autogenerate is used this controls the template used for
# the generated migration.
# The 3 following templates are tried in order.  The first one
# that yields python code that doesn't fail is used.
# apost_templates = base.py.tmpl
# alter_python_function = alter_python_function.pytmpl
# alter_column = alter_column.pytmpl

autogenerate_condition = untouched metadata
autogenerate_style =

